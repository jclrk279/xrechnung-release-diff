name: XRechnung Release Diff
description: Compare invoice fixtures against two pinned KoSIT rule packs locally, without uploading invoice content.
author: ForwardMade
branding:
  icon: git-pull-request
  color: blue
inputs:
  path:
    description: XML fixture file or directory in the checked-out workspace
    required: true
  baseline:
    description: Pinned baseline configuration date
    default: '2026-01-31'
  candidate:
    description: Pinned candidate configuration date
    default: '2026-08-31'
  fail-on:
    description: regressions, candidate-rejections, or never
    default: regressions
  output:
    description: Report directory
    default: xrechnung-diff-results
outputs:
  regressions:
    description: Number of fixtures with new blockers or acceptance regressions
    value: ${{ steps.diff.outputs.regressions }}
  candidate-rejections:
    description: Number of fixtures rejected by the candidate
    value: ${{ steps.diff.outputs.candidate-rejections }}
runs:
  using: composite
  steps:
    - name: Set up Java 17
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - name: Compare pinned rules
      id: diff
      shell: bash
      env:
        XRDIFF_INPUT: ${{ inputs.path }}
        XRDIFF_BASELINE: ${{ inputs.baseline }}
        XRDIFF_CANDIDATE: ${{ inputs.candidate }}
        XRDIFF_FAIL_ON: ${{ inputs.fail-on }}
        XRDIFF_OUTPUT: ${{ inputs.output }}
        XRDIFF_CACHE: ${{ runner.temp }}/xrechnung-release-diff-cache
      run: python3 "$GITHUB_ACTION_PATH/xrechnung_diff.py"
